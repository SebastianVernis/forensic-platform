# Forensic Platform — Cloudflare Workers

name = "forensic-platform"
main = "api/worker.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "forensic-platform-db"
database_id = "ea846046-9719-4ded-afed-da188e7ae4a2"

# R2 Storage for documents
[[r2_buckets]]
binding = "R2"
bucket_name = "forensic-platform-documents"

# KV for sessions and rate limiting
[[kv_namespaces]]
binding = "KV"
id = "8c3179c5ff664f119f61d925c67386db"

# Environment variables
[vars]
ENVIRONMENT = "production"
ALLOWED_ORIGINS = "https://forensic-platform.pages.dev"

# Static assets (Workers Static Assets — new approach)
[assets]
directory = "./frontend"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "single-page-application"
